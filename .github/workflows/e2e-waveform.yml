name: e2e-waveform

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-waveform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waveform-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.58.2

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lesson navigation tests
        run: npm run test:e2e -- e2e/curriculum-lessons.spec.js e2e/lessons.spec.js e2e/mobile-nav.spec.js e2e/offline-shell.spec.js

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lessons-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
